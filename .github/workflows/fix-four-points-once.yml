name: Fix four production points once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply production fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fix-four-production-points.py')
          text = p.read_text(encoding='utf-8')
          old = "for scene in example['scenes']:\n    for index, image in enumerate(scene['images']):"
          new = "for scene in example['scenes']:\n    if 'images' not in scene:\n        continue\n    for index, image in enumerate(scene['images']):"
          if old not in text:
              raise SystemExit('Beispiel-Migrationsblock nicht gefunden')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/fix-four-production-points.py
      - name: Verify repository and current reel
        shell: bash
        run: |
          npm test
          npm run import:reel -- --file input/reel-paket.json --check
          npm run export:prompts -- --dir "reels/2026-KW35_24-08_bis_30-08/sonntag/reel-01_warum-hat-sudafrika-drei-hauptstadte" --strict
          npm run check:content -- --dir "reels/2026-KW35_24-08_bis_30-08/sonntag/reel-01_warum-hat-sudafrika-drei-hauptstadte" --strict
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { inspectReelHook } from './src/shared/reel-hook-quality.js';
          import { findNarrationCueStartPercent } from './src/shared/image-phase-cue.js';
          assert.equal(inspectReelHook({
            narration: 'Südafrika hat nicht nur eine Hauptstadt. Tatsächlich verteilt das Land seine wichtigsten Staatsaufgaben auf drei verschiedene Städte.',
            imageText: 'WARUM DREI HAUPTSTÄDTE?'
          }).passed, true);
          assert.equal(inspectReelHook({
            narration: 'In diesem Video schauen wir uns heute ein interessantes Thema aus der Geografie einmal genauer an.',
            imageText: 'DAS THEMA'
          }).passed, false);
          const cut = findNarrationCueStartPercent(
            'Pretoria wurde zum Verwaltungszentrum. Dort sitzen heute die nationale Regierung, viele Ministerien und die Präsidentschaft in den Union Buildings.',
            'Regierung, viele'
          );
          assert.ok(cut > 0.4 && cut < 0.55);
          NODE
          ! grep -Rqi "No readable text" "reels/2026-KW35_24-08_bis_30-08/sonntag/reel-01_warum-hat-sudafrika-drei-hauptstadte/scenes"
          ! grep -q "image-prompt-03.txt" PRODUCTION_STATUS.md
          grep -q 'kein pauschales `0.5`-Raster' CURRENT_WORKFLOW.md
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bildwechsel an Sprach-Cues binden und Hook absichern"
          git push
