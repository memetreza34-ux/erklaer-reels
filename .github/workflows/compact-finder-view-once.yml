name: Compact Finder migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify and commit executable hooks
        shell: bash
        run: |
          chmod +x scripts/hooks/post-checkout scripts/hooks/post-merge
          npm test
          rm .github/workflows/compact-finder-view-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finder-Aufräumung dauerhaft aktivieren"
          git push
